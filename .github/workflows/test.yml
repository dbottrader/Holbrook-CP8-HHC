name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (holbrook_os + dar_p)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r requirements-dar-p.txt
          pip install -r requirements-onchain.txt

      - name: Verify imports CI would use
        run: |
          python -c "import holbrook_os; import dar_p; from dar_p import GateValidator; print('imports ok')"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Moltbook read-route tests
        run: node --test tests/test_moltbook_api_reads.mjs tests/test_groq_receipt.mjs site/console/ledger.test.mjs

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  moltbook-receipt-chain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Postgres client and test driver
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]"
      - name: Apply the receipt-chain migration on a disposable database
        env:
          MOLTBOOK_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_moltbook_receipt_chain.py

  hhcw-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install OpenZeppelin v5 and forge-std
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.17.0 --no-commit
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography -r requirements-onchain.txt
      - name: Run forge tests
        working-directory: contracts
        run: forge test
      - name: Run offline ledger tests and the local Anvil flow
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_moltbook_onchain_ledger.py tests/test_hhcw_anvil_e2e.py
