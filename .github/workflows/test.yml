name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (holbrook_os + dar_p)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r requirements-dar-p.txt

      - name: Verify imports CI would use
        run: |
          python -c "import holbrook_os; import dar_p; from dar_p import GateValidator; print('imports ok')"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
