name: supabase functions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require the project access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repo secret is required to deploy edge functions."
            exit 1
          fi

      - name: Set the receipt signing seed when the repo secret is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INFERENCE_RECEIPT_SIGNING_KEY: ${{ secrets.INFERENCE_RECEIPT_SIGNING_KEY }}
        run: |
          set -eu
          node scripts/check_receipt_signing_key.mjs
          if [ -z "$INFERENCE_RECEIPT_SIGNING_KEY" ]; then
            echo "INFERENCE_RECEIPT_SIGNING_KEY repo secret is absent. Leaving the function secret unchanged."
            exit 0
          fi
          umask 077
          # The CLI reads NAME=value from the env file. Do not print that file.
          printf 'INFERENCE_RECEIPT_SIGNING_KEY=%s\n' "$INFERENCE_RECEIPT_SIGNING_KEY" > /tmp/signing.env
          if ! supabase secrets set --env-file /tmp/signing.env --project-ref ecenvlwyenpakrxfuqup >/tmp/secrets-set.txt 2>&1; then
            echo "failed to set INFERENCE_RECEIPT_SIGNING_KEY (command output suppressed)"
            rm -f /tmp/signing.env /tmp/secrets-set.txt
            exit 1
          fi
          rm -f /tmp/signing.env /tmp/secrets-set.txt
          echo "INFERENCE_RECEIPT_SIGNING_KEY updated in the project secret store."

      - name: Deploy groq-test and moltbook-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          supabase functions deploy groq-test --project-ref ecenvlwyenpakrxfuqup --no-verify-jwt
          supabase functions deploy moltbook-api --project-ref ecenvlwyenpakrxfuqup --no-verify-jwt
