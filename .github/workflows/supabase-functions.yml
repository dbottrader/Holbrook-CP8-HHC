name: supabase functions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when the project access token is absent
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN is not set. Skipping edge function deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.gate.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set the receipt signing seed when the repo secret is present
        if: steps.gate.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INFERENCE_RECEIPT_SIGNING_KEY: ${{ secrets.INFERENCE_RECEIPT_SIGNING_KEY }}
        run: |
          set -eu
          INFERENCE_RECEIPT_SIGNING_KEY=$(printf '%s' "$INFERENCE_RECEIPT_SIGNING_KEY" | tr -d '[:space:]')
          export INFERENCE_RECEIPT_SIGNING_KEY
          node scripts/check_receipt_signing_key.mjs
          if [ -z "$INFERENCE_RECEIPT_SIGNING_KEY" ]; then
            echo "INFERENCE_RECEIPT_SIGNING_KEY repo secret is absent. Leaving the function secret unchanged."
            exit 0
          fi
          umask 077
          # The CLI reads NAME=value from the env file. Do not print that file.
          printf 'INFERENCE_RECEIPT_SIGNING_KEY=%s\n' "$INFERENCE_RECEIPT_SIGNING_KEY" > /tmp/signing.env
          if ! supabase secrets set --env-file /tmp/signing.env --project-ref ecenvlwyenpakrxfuqup >/tmp/secrets-set.txt 2>&1; then
            echo "failed to set INFERENCE_RECEIPT_SIGNING_KEY (command output suppressed)"
            rm -f /tmp/signing.env /tmp/secrets-set.txt
            exit 1
          fi
          rm -f /tmp/signing.env /tmp/secrets-set.txt
          echo "INFERENCE_RECEIPT_SIGNING_KEY updated in the project secret store."

      - name: Deploy edge functions that exist in this checkout
        if: steps.gate.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          for name in groq-test moltbook-api gpu-mesh; do
            if [ -f "supabase/functions/$name/index.ts" ]; then
              supabase functions deploy "$name" --project-ref ecenvlwyenpakrxfuqup --no-verify-jwt
            else
              echo "skip $name (not in this checkout)"
            fi
          done
