name: CP8 Runtime Governance Tests

on:
  pull_request:
    paths:
      - 'cp8_runtime/**'
      - 'dar_p/**'
      - 'tests/test_gate_validator.py'
      - 'tests/test_runtime_governance.py'
      - 'requirements-test.txt'
      - '.github/workflows/cp8-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp8-runtime-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run DAR-P and CP8 governance tests
        run: python -m pytest -q tests/test_gate_validator.py tests/test_runtime_governance.py
