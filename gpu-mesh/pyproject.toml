[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpumesh"
version = "0.1.0"
description = "Volunteer GPU network for free open-weight model inference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dennis (github.com/dbottrader) and contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "cryptography>=43",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
proof = ["numpy>=1.26", "toploc==0.1.6"]
cpu = ["llama-cpp-python>=0.3.4"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
gpumesh-coordinator = "gpumesh.__main__:main"
gpumesh-node = "gpumesh_node.__main__:main"
gpumesh-verify-ledger = "gpumesh.verify_cli:main"

[tool.setuptools.packages.find]
include = ["gpumesh*", "gpumesh_node*"]

[tool.setuptools.package-data]
gpumesh = ["static/*", "assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
