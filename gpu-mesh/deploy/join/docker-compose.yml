# Volunteer worker against a coordinator you already have.
# HHC recorded by that coordinator is a simulated utility credit.
#
#   docker compose -f gpu-mesh/deploy/join/docker-compose.yml up --build
# GPU_MESH_COORDINATOR overrides the public coordinator below.
#   GPU_MESH_BACKEND=ollama docker compose --profile ollama up --build
#
# Ollama's image is the official ollama/ollama image, pinned by tag.
# The coordinator ledger defaults to simulated. It settles to the Base work token once the on-chain backend is enabled. This file does not deploy a contract.

services:
  worker:
    image: ghcr.io/dbottrader/holbrook-cp8-hhc/gpumesh-join:${GPU_MESH_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/join/Dockerfile
    environment:
      GPU_MESH_COORDINATOR: ${GPU_MESH_COORDINATOR:-https://ecenvlwyenpakrxfuqup.supabase.co/functions/v1/gpu-mesh}
      GPU_MESH_BACKEND: ${GPU_MESH_BACKEND:-llamacpp}
      GPU_MESH_OLLAMA_HOST: ${GPU_MESH_OLLAMA_HOST:-http://ollama:11434}
      GPU_MESH_INVITE: ${GPU_MESH_INVITE:-}
      GPU_MESH_NAME: ${GPU_MESH_NAME:-volunteer}
      GPU_MESH_PAYOUT_ADDRESS: ${GPU_MESH_PAYOUT_ADDRESS:-}
      GPU_MESH_ALLOW_CPU: "1"
    volumes:
      - join-data:/var/lib/gpumesh
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  join-data:
  ollama:
